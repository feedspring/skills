<!--
  FeedSpring — Google Reviews grid
  Mirrors the Google Reviews "Basic Header" and "Basic Grid" components: a
  summary panel with the average rating and a review button, above a grid of
  review cards.

  Setup:
  1. Put the script in <head>
  2. Replace the placeholder Feed ID on .fs-gr with your own (starts with google_)
  3. Replace YOUR_PLACE_ID in the two links with your Google Place ID
  4. Restyle freely. Colours, radius and spacing are CSS variables at the top of
     the <style> block. The feedspring and feed-field attributes are the only
     parts FeedSpring needs — the classes and CSS are yours.

  STATIC RENDERING — READ THIS BEFORE CHANGING IT
  This template repeats the review card 6 times instead of using a single card
  with render:dynamic. The current Google Reviews script has a bug where
  dynamic rendering multiplies the stars on every review after the first. Static
  rendering shows stars correctly. To show more or fewer reviews, add or remove
  whole cards. Once the fix is released, you can replace the 6 cards with one
  card and add feed-options="render:dynamic|limit:6" to the section.

  Stars are a repeater, not a value: FeedSpring clones feed-field="star" once
  per rating point and feed-field="star-inactive" for the remainder. Keep both
  in every card — they are templates, not visible elements.

  Google exposes no per-review URL, so there is no link field. The button and
  footer link point at the business listing instead.

  Some Google reviews are a star rating with no text. Empty review text is
  hidden with CSS so those cards don't show a blank gap.
-->

<script src="https://scripts.feedspring.com/google-reviews-attrs.js" async defer></script>

<style>
  .fs-gr {
    /* Design tokens — change these to restyle the whole feed */
    --fs-text-primary: #141414;
    --fs-text-secondary: #444444;
    --fs-text-tertiary: #737373;
    --fs-text-inverse: #ffffff;
    --fs-border-secondary: #ebebeb;
    --fs-background-primary: #ffffff;
    --fs-background-secondary: #f7f7f7;
    --fs-background-active: #ebebeb;
    --fs-background-strong: #141414;
    --fs-rating-active: #ffbf6e;
    --fs-rating-inactive: #ffbf6e80;

    --fs-gr-columns: 3;
    --fs-gr-gap: 16px;
    --fs-gr-radius: 24px;
    --fs-gr-lines: 3;

    max-width: 1140px;
    margin: 0 auto;
    padding: 0 16px;
    font-family: inherit;
    color: var(--fs-text-primary);
  }

  .fs-gr *,
  .fs-gr *::before,
  .fs-gr *::after { box-sizing: border-box; }

  .fs-gr p { margin: 0; }

  .fs-gr__sprite { position: absolute; width: 0; height: 0; overflow: hidden; }

  .fs-gr__sr {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  /* Summary header */
  .fs-gr__header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 16px 24px;
    margin-bottom: 24px;
    padding: 24px;
    border-radius: var(--fs-gr-radius);
    background: var(--fs-background-secondary);
  }

  .fs-gr__summary { display: flex; flex-direction: column; gap: 8px; }

  .fs-gr__title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 24px;
    line-height: 32px;
    font-weight: 600;
  }

  .fs-gr__rating { display: flex; align-items: center; gap: 6px; font-size: 16px; }
  .fs-gr__average { font-weight: 600; }
  .fs-gr__rating-star { color: var(--fs-rating-active); }
  .fs-gr__total { color: var(--fs-text-tertiary); }

  .fs-gr__button {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 24px;
    border-radius: 50px;
    background: var(--fs-background-strong);
    color: var(--fs-text-inverse);
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    transition: opacity 0.2s ease;
  }
  .fs-gr__button:hover { opacity: 0.85; }

  .fs-gr__button-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--fs-background-primary);
  }

  /* Review cards */
  .fs-gr__grid {
    display: grid;
    grid-template-columns: repeat(var(--fs-gr-columns), 1fr);
    gap: var(--fs-gr-gap);
  }

  .fs-gr__card {
    display: flex;
    flex-direction: column;
    gap: 24px;
    padding: 24px;
    border: 1px solid var(--fs-border-secondary);
    border-radius: var(--fs-gr-radius);
    background: var(--fs-background-primary);
  }

  .fs-gr__stars { display: flex; gap: 4px; }
  .fs-gr__star { width: 24px; height: 24px; color: var(--fs-rating-active); }
  .fs-gr__star--inactive { color: var(--fs-rating-inactive); }

  .fs-gr__text {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: var(--fs-gr-lines);
    overflow: hidden;
    overflow-wrap: anywhere;
    font-size: 16px;
    line-height: 28px;
    color: var(--fs-text-secondary);
  }
  .fs-gr__text:empty { display: none; }

  .fs-gr__author {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: auto;
    padding-top: 24px;
    border-top: 1px solid var(--fs-border-secondary);
  }

  .fs-gr__avatar-wrap { position: relative; flex: none; display: flex; }

  .fs-gr__avatar {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    object-fit: cover;
    background: var(--fs-background-active);
  }

  .fs-gr__badge {
    position: absolute;
    right: -4px;
    bottom: -4px;
    display: flex;
    padding: 4px;
    border-radius: 50%;
    background: var(--fs-background-primary);
    box-shadow: 0 0 0 1px var(--fs-border-secondary);
  }

  .fs-gr__meta { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .fs-gr__name { font-size: 16px; font-weight: 500; }
  .fs-gr__date { font-size: 14px; color: var(--fs-text-tertiary); }

  /* Footer link */
  .fs-gr__footer { display: flex; justify-content: center; margin-top: 40px; }

  .fs-gr__all {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 12px 20px;
    border-radius: var(--fs-gr-radius);
    background: var(--fs-background-secondary);
    color: var(--fs-text-secondary);
    font-size: 14px;
    text-decoration: none;
    transition: background-color 0.2s ease;
  }
  .fs-gr__all:hover { background: var(--fs-background-active); }

  .fs-gr__button:focus-visible,
  .fs-gr__all:focus-visible { outline: 2px solid var(--fs-background-strong); outline-offset: 3px; }

  @media (max-width: 900px) {
    .fs-gr { --fs-gr-columns: 2; }
  }

  @media (max-width: 600px) {
    .fs-gr { --fs-gr-columns: 1; }
    .fs-gr__header { padding: 20px; }
    .fs-gr__button { width: 100%; justify-content: center; }
  }

  @media (prefers-reduced-motion: reduce) {
    .fs-gr__button, .fs-gr__all { transition: none; }
  }
</style>
