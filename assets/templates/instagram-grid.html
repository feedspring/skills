<!--
  FeedSpring — Instagram grid
  A responsive image grid with a profile header and hover overlay.

  Setup:
  1. Put the script in <head>
  2. Replace the Feed ID on .fs-ig with your own (starts with inst_)
  3. Restyle freely — the feedspring and feed-field attributes are the only
     things FeedSpring needs. Classes and CSS are entirely yours.

  Instagram posts vary in aspect ratio (1:1, 4:5, 1.91:1). This template crops
  to square with object-fit. For native ratios, remove aspect-ratio from
  .fs-ig__media and use a masonry layout instead.
-->

<script src="https://scripts.feedspring.com/instagram-attrs.js" async defer></script>

<!-- FeedSpring demo feed — replace with your own Feed ID before publishing -->
<section class="fs-ig" feedspring="inst_55ZVUQExmdej0j8vygUoP" feed-options="render:dynamic|limit:8">

  <header class="fs-ig__header">
    <img class="fs-ig__avatar" feed-field="avatar" alt="" />
    <div>
      <p class="fs-ig__name" feed-field="name"></p>
      <p class="fs-ig__handle">@<span feed-field="username"></span></p>
    </div>
    <p class="fs-ig__followers"><span feed-field="follower-count"></span> followers</p>
  </header>

  <div class="fs-ig__loading" feedspring="loading">
    <div class="fs-ig__skeleton"></div>
    <div class="fs-ig__skeleton"></div>
    <div class="fs-ig__skeleton"></div>
    <div class="fs-ig__skeleton"></div>
  </div>

  <div class="fs-ig__grid">
    <article class="fs-ig__post" feedspring="post" style="display:none">
      <img class="fs-ig__media" feed-field="img" alt="" loading="lazy" />
      <div class="fs-ig__overlay">
        <p class="fs-ig__caption" feed-field="caption"></p>
        <p class="fs-ig__meta">
          <span feed-field="like-count"></span> likes ·
          <time feed-field="timestamp" feed-timestamp="from-now"></time>
        </p>
      </div>
      <a class="fs-ig__link" feed-field="link" target="_blank" rel="noopener" aria-label="View on Instagram"></a>
    </article>
  </div>

</section>

<style>
  .fs-ig { max-width: 1120px; margin: 0 auto; padding: 0 16px; }

  .fs-ig__header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  .fs-ig__avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; }
  .fs-ig__name { margin: 0; font-weight: 600; }
  .fs-ig__handle { margin: 0; opacity: 0.6; font-size: 0.875rem; }
  .fs-ig__followers { margin: 0 0 0 auto; font-size: 0.875rem; opacity: 0.6; }

  .fs-ig__grid,
  .fs-ig__loading { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }

  .fs-ig__skeleton {
    aspect-ratio: 1 / 1;
    border-radius: 12px;
    background: linear-gradient(90deg, #e8e8e8 25%, #f5f5f5 50%, #e8e8e8 75%);
    background-size: 200% 100%;
    animation: fs-shimmer 1.5s infinite;
  }
  @keyframes fs-shimmer {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  .fs-ig__post { position: relative; aspect-ratio: 1 / 1; border-radius: 12px; overflow: hidden; }
  .fs-ig__media { width: 100%; height: 100%; object-fit: cover; display: block; }

  .fs-ig__overlay {
    position: absolute;
    inset: auto 0 0 0;
    padding: 16px 12px 12px;
    color: #fff;
    background: linear-gradient(transparent, rgba(0, 0, 0, 0.72));
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  .fs-ig__post:hover .fs-ig__overlay,
  .fs-ig__post:focus-within .fs-ig__overlay { opacity: 1; }

  .fs-ig__caption {
    margin: 0 0 4px;
    font-size: 0.8125rem;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .fs-ig__meta { margin: 0; font-size: 0.75rem; opacity: 0.85; }

  .fs-ig__link { position: absolute; inset: 0; }
  .fs-ig__link:focus-visible { outline: 2px solid #fff; outline-offset: -4px; }

  @media (max-width: 900px) {
    .fs-ig__grid, .fs-ig__loading { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 560px) {
    .fs-ig__grid, .fs-ig__loading { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .fs-ig__overlay { opacity: 1; }
  }
</style>
