<!--
  FeedSpring — Instagram grid
  Mirrors the Instagram "Basic Grid" component: a pill-shaped profile bar
  above a grid of square posts that reveal the Instagram icon on hover.

  Setup:
  1. Put the script in <head>
  2. Replace the placeholder Feed ID on .fs-ig with your own (starts with inst_)
  3. Replace YOUR_INSTAGRAM_HANDLE in the Follow button link. Instagram has no
     profile-link field, so this link is static.
  4. Restyle freely. Colours, radius and spacing are CSS variables at the top of
     the <style> block, including --fs-font-family (set it to inherit to use
     your site's font). The feedspring and feed-field attributes are the only
     parts FeedSpring needs — the classes and CSS are yours.

  Instagram posts vary in aspect ratio (1:1, 4:5, 1.91:1). This template crops
  to square with object-fit. Change --fs-ig-ratio to 4 / 5 for portrait cards.

  Profile fields (avatar, name, username, follower-count, following-count) sit
  inside the wrapper but outside the post template.
-->

<script src="https://scripts.feedspring.com/instagram-attrs.js" async defer></script>

<!-- Placeholder Feed ID — replace with your own FeedSpring Feed ID before publishing -->
<section class="fs-ig" feedspring="inst_55ZVUQExmdej0j8vygUoP" feed-options="render:dynamic|limit:8">

  <header class="fs-ig__profile">
    <img class="fs-ig__avatar" feed-field="avatar" alt="" />

    <div class="fs-ig__identity">
      <p class="fs-ig__name" feed-field="name"></p>
      <p class="fs-ig__handle">@<span feed-field="username"></span></p>
    </div>

    <div class="fs-ig__stats">
      <span class="fs-ig__divider" aria-hidden="true"></span>
      <p class="fs-ig__stat">
        <span class="fs-ig__stat-number" feed-field="follower-count"></span>
        <span class="fs-ig__stat-label">Followers</span>
      </p>
      <p class="fs-ig__stat">
        <span class="fs-ig__stat-number" feed-field="following-count"></span>
        <span class="fs-ig__stat-label">Following</span>
      </p>
    </div>

    <a class="fs-ig__follow" href="https://www.instagram.com/YOUR_INSTAGRAM_HANDLE" target="_blank" rel="noopener">
      <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><use href="#fs-ig-logo" /></svg>
      Follow Me
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </a>
  </header>

  <div class="fs-ig__grid">
    <article class="fs-ig__card" feedspring="post" style="display:none">
      <img class="fs-ig__image" feed-field="img" alt="" loading="lazy" />
      <a class="fs-ig__overlay" feed-field="link" target="_blank" rel="noopener" aria-label="View post on Instagram">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><use href="#fs-ig-logo" /></svg>
      </a>
    </article>
  </div>

  <!-- Icon defined once, reused above with <use> -->
  <svg class="fs-ig__sprite" aria-hidden="true">
    <symbol id="fs-ig-logo" viewBox="0 0 24 24">
      <path fill="currentColor" d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z" />
    </symbol>
  </svg>

</section>

<style>
  .fs-ig {
    /* Design tokens — change these to restyle the whole feed */
    /* Font — uses Inter if the page already has it, otherwise the system font.
       Nothing is downloaded. Set to inherit to use your site's own font. */
    --fs-font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

    --fs-text-primary: #141414;
    --fs-text-tertiary: #737373;
    --fs-text-inverse: #ffffff;
    --fs-border-secondary: #ebebeb;
    --fs-background-primary: #ffffff;
    --fs-background-strong: #141414;
    --fs-background-overlay: rgba(20, 20, 20, 0.6);

    --fs-ig-columns: 4;
    --fs-ig-gap: 16px;
    --fs-ig-radius: 28px;
    --fs-ig-ratio: 1 / 1;

    max-width: 1140px;
    margin: 0 auto;
    padding: 0 16px;
    font-family: var(--fs-font-family);
    color: var(--fs-text-primary);
  }

  .fs-ig *,
  .fs-ig *::before,
  .fs-ig *::after { box-sizing: border-box; }

  .fs-ig p { margin: 0; }

  .fs-ig__sprite { position: absolute; width: 0; height: 0; overflow: hidden; }

  /* Profile bar */
  .fs-ig__profile {
    display: flex;
    align-items: center;
    margin-bottom: 32px;
    padding: 20px;
    border: 1px solid var(--fs-border-secondary);
    border-radius: 48px;
    background: var(--fs-background-primary);
  }

  .fs-ig__avatar {
    flex: none;
    width: 56px;
    height: 56px;
    margin-right: 20px;
    border-radius: 50%;
    object-fit: cover;
    background: var(--fs-border-secondary);
  }

  .fs-ig__identity { display: flex; flex-direction: column; gap: 2px; margin-right: 12px; min-width: 0; }
  .fs-ig__name { font-size: 16px; line-height: 24px; font-weight: 500; }
  .fs-ig__handle { font-size: 14px; line-height: 20px; color: var(--fs-text-tertiary); }

  .fs-ig__stats { display: flex; align-items: center; gap: 32px; flex: 1; }
  .fs-ig__divider { width: 1px; height: 32px; background: var(--fs-border-secondary); }
  .fs-ig__stat { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .fs-ig__stat-number { font-size: 16px; font-weight: 500; }
  .fs-ig__stat-label { font-size: 14px; color: var(--fs-text-tertiary); }
  /* FeedSpring leaves a count blank when it is 0 — hide the label with it */
  .fs-ig__stat:has(> [feed-field]:empty) { display: none; }

  .fs-ig__follow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
    padding: 12px 16px;
    border-radius: 20px;
    background: var(--fs-background-strong);
    color: var(--fs-text-inverse);
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    white-space: nowrap;
    transition: opacity 0.2s ease;
  }
  .fs-ig__follow:hover { opacity: 0.8; }

  /* Grid */
  .fs-ig__grid {
    display: grid;
    grid-template-columns: repeat(var(--fs-ig-columns), 1fr);
    gap: var(--fs-ig-gap);
  }

  .fs-ig__card {
    position: relative;
    display: flex;
    aspect-ratio: var(--fs-ig-ratio);
    overflow: hidden;
    border-radius: var(--fs-ig-radius);
    background: var(--fs-border-secondary);
  }

  .fs-ig__image {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.4s;
  }

  .fs-ig__overlay {
    position: absolute;
    inset: 0;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--fs-background-overlay);
    color: var(--fs-text-inverse);
    opacity: 0;
    transition: opacity 0.4s;
  }

  /* Hover and keyboard focus reveal the overlay and zoom the image */
  .fs-ig__card:hover .fs-ig__overlay,
  .fs-ig__card:focus-within .fs-ig__overlay { opacity: 1; }
  .fs-ig__card:hover .fs-ig__image,
  .fs-ig__card:focus-within .fs-ig__image { transform: scale(1.1); }
  .fs-ig__overlay:focus-visible { outline: 3px solid var(--fs-text-inverse); outline-offset: -6px; border-radius: var(--fs-ig-radius); }
  .fs-ig__follow:focus-visible { outline: 2px solid var(--fs-background-strong); outline-offset: 3px; }

  @media (max-width: 900px) {
    .fs-ig { --fs-ig-columns: 3; }
  }

  @media (max-width: 640px) {
    .fs-ig { --fs-ig-columns: 2; }
    .fs-ig__stats { display: none; }
  }

  @media (max-width: 480px) {
    .fs-ig { --fs-ig-gap: 8px; --fs-ig-radius: 16px; }
    .fs-ig__profile { padding: 12px; }
    .fs-ig__avatar { width: 44px; height: 44px; margin-right: 12px; }
    .fs-ig__handle { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .fs-ig__image, .fs-ig__overlay, .fs-ig__follow { transition: none; }
    .fs-ig__card:hover .fs-ig__image,
    .fs-ig__card:focus-within .fs-ig__image { transform: none; }
  }
</style>
