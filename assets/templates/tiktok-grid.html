<!--
  FeedSpring — TikTok video grid
  Mirrors the TikTok "Grid Basic" component: portrait video thumbnails with the
  TikTok logo and view, like and share counts, linking out to TikTok.

  Setup:
  1. Put the script in <head>
  2. Replace the placeholder Feed ID on .fs-tt with your own (starts with tiktok_)
  3. Restyle freely. Colours, radius and spacing are CSS variables at the top of
     the <style> block, including --fs-font-family (set it to inherit to use
     your site's font). The feedspring and feed-field attributes are the only
     parts FeedSpring needs — the classes and CSS are yours.

  TikTok videos are always 9:16 portrait. Cropping to square or landscape looks
  wrong — keep --fs-tt-ratio at 9 / 16.

  The link wraps the whole card. It sits inside the feedspring="post" element
  rather than being the post element itself, because FeedSpring only fills
  fields inside the post template.

  This template links out rather than embedding. Inline playback is available
  via feed-field="video" on an <iframe>, but it loads TikTok's embed player,
  which is heavy. Only use it when playback in-page is genuinely needed.

  share-count is a plain number; view-count and like-count are abbreviated
  (1.2K). On narrow screens the share badge is hidden to keep the row tidy.
-->

<script src="https://scripts.feedspring.com/tiktok-attrs.js" async defer></script>

<!-- Placeholder Feed ID — replace with your own FeedSpring Feed ID before publishing -->
<section class="fs-tt" feedspring="tiktok_7ZTDgAmbdnLstuHJ2srlq" feed-options="render:dynamic|limit:8">

  <div class="fs-tt__grid">
    <article class="fs-tt__item" feedspring="post" style="display:none">
      <a class="fs-tt__card" feed-field="link" target="_blank" rel="noopener" aria-label="Watch on TikTok">
        <img class="fs-tt__image" feed-field="img" alt="" loading="lazy" />

        <svg class="fs-tt__logo" viewBox="0 0 24 24" aria-hidden="true"><use href="#fs-tt-logo" /></svg>

        <span class="fs-tt__badges">
          <span class="fs-tt__badge">
            <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#fs-tt-play" /></svg>
            <span feed-field="view-count"></span>
          </span>
          <span class="fs-tt__badge">
            <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#fs-tt-heart" /></svg>
            <span feed-field="like-count"></span>
          </span>
          <span class="fs-tt__badge fs-tt__badge--share">
            <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#fs-tt-share" /></svg>
            <span feed-field="share-count"></span>
          </span>
        </span>
      </a>
    </article>
  </div>

<style>
  .fs-tt {
    /* Design tokens — change these to restyle the whole feed */
    /* Font — uses Inter if the page already has it, otherwise the system font.
       Nothing is downloaded. Set to inherit to use your site's own font. */
    --fs-font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

    --fs-text-inverse: #ffffff;
    --fs-border-secondary: #ebebeb;
    --fs-badge-background: rgba(8, 8, 11, 0.4);

    --fs-tt-columns: 4;
    --fs-tt-gap: 16px;
    --fs-tt-radius: 8px;
    --fs-tt-ratio: 9 / 16;

    max-width: 1140px;
    margin: 0 auto;
    padding: 0 16px;
    font-family: var(--fs-font-family);
  }

  .fs-tt *,
  .fs-tt *::before,
  .fs-tt *::after { box-sizing: border-box; }

  .fs-tt__sprite { position: absolute; width: 0; height: 0; overflow: hidden; }

  .fs-tt__grid {
    display: grid;
    grid-template-columns: repeat(var(--fs-tt-columns), 1fr);
    gap: var(--fs-tt-gap);
  }

  .fs-tt__card {
    position: relative;
    display: flex;
    aspect-ratio: var(--fs-tt-ratio);
    overflow: hidden;
    border-radius: var(--fs-tt-radius);
    background: var(--fs-border-secondary);
    color: var(--fs-text-inverse);
    text-decoration: none;
  }

  .fs-tt__image {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.4s;
  }

  .fs-tt__logo {
    position: absolute;
    top: 16px;
    left: 16px;
    z-index: 1;
    width: 40px;
    height: 40px;
  }

  .fs-tt__badges {
    position: absolute;
    inset: auto 0 0 0;
    z-index: 1;
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 8px;
    padding: 16px;
  }

  .fs-tt__badge {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    height: 28px;
    padding: 2px 8px 2px 4px;
    border-radius: 4px;
    background: var(--fs-badge-background);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    font-size: 14px;
    line-height: 24px;
    white-space: nowrap;
  }
  .fs-tt__badge svg { width: 24px; height: 24px; }
  /* FeedSpring leaves a count blank when it is 0 — hide the empty badge */
  .fs-tt__badge:has(> [feed-field]:empty) { display: none; }

  /* Hover and keyboard focus zoom the thumbnail */
  .fs-tt__card:hover .fs-tt__image,
  .fs-tt__card:focus-visible .fs-tt__image { transform: scale(1.1); }
  .fs-tt__card:focus-visible { outline: 3px solid #25f4ee; outline-offset: 2px; }

  @media (max-width: 900px) {
    .fs-tt { --fs-tt-columns: 3; }
  }

  @media (max-width: 640px) {
    .fs-tt { --fs-tt-columns: 2; --fs-tt-gap: 8px; }
    .fs-tt__logo { top: 10px; left: 10px; width: 28px; height: 28px; }
    .fs-tt__badges { gap: 4px; padding: 8px; }
    .fs-tt__badge { height: 20px; padding: 2px 6px 2px 2px; font-size: 12px; line-height: 16px; }
    .fs-tt__badge svg { width: 16px; height: 16px; }
    .fs-tt__badge--share { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .fs-tt__image { transition: none; }
    .fs-tt__card:hover .fs-tt__image,
    .fs-tt__card:focus-visible .fs-tt__image { transform: none; }
  }
</style>
