<!--
  FeedSpring — Dribbble portfolio grid
  Mirrors the Dribbble "Card Grid" component: a pill-shaped designer header with
  a Follow button, above a grid of shots that reveal the Dribbble logo on hover.

  Setup:
  1. Put the script in <head>
  2. Replace the placeholder Feed ID on .fs-db with your own (starts with dribbble_)
  3. Restyle freely. Colours, radius and spacing are CSS variables at the top of
     the <style> block. The feedspring and feed-field attributes are the only
     parts FeedSpring needs — the classes and CSS are yours.

  Dribbble shots are 4:3. Keep --fs-db-ratio at 4 / 3 or shots will be cropped.

  The follower field is feed-field="followers" on Dribbble, not
  "follower-count" like Instagram and TikTok.

  Each shot's title is placed inside its link as visually hidden text, so the
  link has a meaningful name for screen readers without showing on the card.

  Dribbble exposes no like or view counts through FeedSpring.
-->

<script src="https://scripts.feedspring.com/dribbble-attrs.js" async defer></script>

<!-- Placeholder Feed ID — replace with your own FeedSpring Feed ID before publishing -->
<section class="fs-db" feedspring="dribbble_3qm4sGbu4uWQI2asUboPC" feed-options="render:dynamic|limit:9">

  <header class="fs-db__header">
    <div class="fs-db__identity">
      <img class="fs-db__avatar" feed-field="avatar" alt="" />
      <div>
        <p class="fs-db__name" feed-field="name"></p>
        <p class="fs-db__followers"><span feed-field="followers"></span> Followers</p>
      </div>
    </div>

    <span class="fs-db__divider" aria-hidden="true"></span>

    <p class="fs-db__bio" feed-field="bio"></p>

        <span class="fs-db__sr" feed-field="title"></span>

    </article>
  </div>

</section>

<style>
  .fs-db {
    /* Design tokens — change these to restyle the whole feed */
    --fs-text-primary: #141414;
    --fs-text-secondary: #444444;
    --fs-text-inverse: #ffffff;
    --fs-border-secondary: #ebebeb;
    --fs-background-overlay: rgba(20, 20, 20, 0.6);
    --fs-dribbble-pink: #ea4c89;

    --fs-db-columns: 3;
    --fs-db-gap: 24px;
    --fs-db-radius: 28px;
    --fs-db-ratio: 4 / 3;

    max-width: 1140px;
    margin: 0 auto;
    padding: 0 16px;
    font-family: inherit;
    color: var(--fs-text-primary);
  }

  .fs-db *,
  .fs-db *::before,
  .fs-db *::after { box-sizing: border-box; }

  .fs-db p { margin: 0; }

  .fs-db__sr {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  /* Designer header */
  .fs-db__header {
    display: flex;
    align-items: center;
    gap: 32px;
    margin-bottom: 32px;
    padding: 24px;
    border: 1px solid var(--fs-border-secondary);
    border-radius: 88px;
  }

  .fs-db__identity { display: flex; align-items: center; gap: 16px; flex: none; }

  .fs-db__avatar {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    object-fit: cover;
    background: var(--fs-border-secondary);
  }

  .fs-db__name { font-size: 18px; line-height: 32px; font-weight: 600; }
  .fs-db__followers { font-size: 16px; line-height: 24px; color: var(--fs-text-secondary); }
  /* FeedSpring leaves a count blank when it is 0 — hide the label with it */
  .fs-db__followers:has(> [feed-field]:empty) { display: none; }

  .fs-db__divider { flex: none; width: 1px; height: 40px; background: var(--fs-border-secondary); }

  .fs-db__bio {
    flex: 1;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 3;
    overflow: hidden;
    overflow-wrap: anywhere;
    max-width: 440px;
    font-size: 16px;
    line-height: 24px;
    letter-spacing: -0.02em;
    color: var(--fs-text-secondary);
  }

  .fs-db__follow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    flex: none;
    margin-left: auto;
    padding: 13px 16px;
    border-radius: 48px;
    background: var(--fs-dribbble-pink);
    color: var(--fs-text-inverse);
    font-size: 14px;
    line-height: 24px;
    font-weight: 500;
    text-decoration: none;
    transition: opacity 0.2s ease;
  }
  .fs-db__follow:hover { opacity: 0.85; }

  /* Shot grid */
  .fs-db__grid {
    display: grid;
    grid-template-columns: repeat(var(--fs-db-columns), 1fr);
    gap: var(--fs-db-gap);
  }

  .fs-db__card {
    position: relative;
    display: flex;
    aspect-ratio: var(--fs-db-ratio);
    overflow: hidden;
    border-radius: var(--fs-db-radius);
    background: var(--fs-border-secondary);
  }

  .fs-db__image {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.4s;
  }

  .fs-db__overlay {
    position: absolute;
    inset: 0;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--fs-background-overlay);
    color: var(--fs-text-inverse);
    opacity: 0;
    transition: opacity 0.4s;
  }

  /* Hover and keyboard focus reveal the overlay and zoom the image */
  .fs-db__card:hover .fs-db__overlay,
  .fs-db__card:focus-within .fs-db__overlay { opacity: 1; }
  .fs-db__card:hover .fs-db__image,
  .fs-db__card:focus-within .fs-db__image { transform: scale(1.1); }
  .fs-db__overlay:focus-visible { outline: 3px solid var(--fs-text-inverse); outline-offset: -6px; border-radius: var(--fs-db-radius); }
  .fs-db__follow:focus-visible { outline: 2px solid var(--fs-dribbble-pink); outline-offset: 3px; }

  @media (max-width: 900px) {
    .fs-db { --fs-db-columns: 2; --fs-db-gap: 16px; }
    .fs-db__header {
      flex-direction: column;
      gap: 20px;
      border-radius: 32px;
      text-align: center;
    }
    .fs-db__identity { flex-direction: column; gap: 12px; }
    .fs-db__divider { width: 90%; height: 1px; }
    .fs-db__bio { flex: none; }
    .fs-db__follow { margin-left: 0; }
  }

  @media (max-width: 560px) {
    .fs-db { --fs-db-columns: 1; --fs-db-radius: 20px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .fs-db__image, .fs-db__overlay, .fs-db__follow { transition: none; }
    .fs-db__card:hover .fs-db__image,
    .fs-db__card:focus-within .fs-db__image { transform: none; }
  }
</style>
